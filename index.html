<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>羽毛球活动费用计算</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --court-green: #1a7f4e;      /* 卡片内强调色 */
    --court-green-dark: #0e5c38;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 深灰背景 */
    background: #1E1E1F;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px 20px;
  }

  /* 左右两栏：默认 stretch，让两张卡片等高 */
  .wrap {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 0;
    align-items: stretch;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
  }

  .panel {
    background: #fff;
    padding: 28px;
    min-width: 0;
  }
  .panel:first-child {
    border-radius: 18px 0 0 18px;
    border-right: 1px dashed #d5d2c9;
  }

  .panel.bill {
    position: relative;
    display: flex;
    flex-direction: column;
    background: #fffdf7;
    border-radius: 0 18px 18px 0;
    padding: 28px 30px 24px;
  }

  h1 { font-size: 19px; margin: 0 0 4px; color: #1f2937; }
  .sub { font-size: 12.5px; color: #9ca3af; margin-bottom: 18px; }

  /* 输入区：统一 4 列，保证输入框等宽、左对齐 */
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }

  .field { margin-bottom: 6.5px; min-width: 0; }
  label {
    display: block;
    font-size: 12px;
    color: #555;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  input {
    width: 100%;
    padding: 10px 8px;
    border: 1px solid #d9dce3;
    border-radius: 10px;
    font-size: 15px;
    text-align: center;
    outline: none;
    transition: .18s;
    background: #fafbfc;
    -moz-appearance: textfield;
  }
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input:focus {
    border-color: var(--court-green);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(26, 127, 78, .18);
  }
  .section-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--court-green);
    letter-spacing: .5px;
    margin: 4px 0 10px;
  }

  /* 小票账单 */
  .bill-header {
    text-align: center;
    border-bottom: 1px solid transparent;
    padding-bottom: 20px;
    margin-bottom: 5px;
  }
  .bill-eyebrow {
    font-size: 9px;
    letter-spacing: 3px;
    color: #99958b;
    margin-bottom: 9px;
  }
  .bill-title { font-size: 21px; font-weight: 650; letter-spacing: 3px; color: #30392f; margin-bottom: 7px; }
  .bill-sub { font-size: 11px; color: #99958b; letter-spacing: 1px; }
  .bill-group-label {
    font-size: 11px;
    font-weight: 600;
    color: #8b887e;
    letter-spacing: 2px;
    margin: 18px 0 8px;
  }
  .line {
    display: flex;
    align-items: baseline;
    gap: 12px;
    font-size: 13px;
    color: #65675f;
    padding: 6px 0;
  }
  .line::after { content: ''; flex: 1; border-bottom: 1px dotted #e2dfd5; }
  .line span:first-child { order: 0; }
  .line::after { order: 1; }
  .line span:last-child {
    order: 2;
    color: #343b32;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    overflow-wrap: anywhere;
    text-align: right;
    min-width: 0;
  }
  .line.sub-line { font-size: 12px; color: #99958b; }
  .line.sub-line span:last-child { font-weight: 400; color: #88877f; }
  .line.total { border-top: 1px dashed #d5d2c9; margin-top: 9px; padding-top: 13px; color: #343b32; font-weight: 600; }
  .line.total::after { border: 0; }
  .line.total span:last-child { font-weight: 700; }
  .divider { width: 100%; border: none; border-top: 1px dashed #d5d2c9; margin: 14px 0 0; }
  .profit-box {
    margin-top: 9px;
    padding: 8px 0;
    border-top: 2px solid #414b3f;
    border-bottom: 1px solid transparent;
    display: flex;
    gap: 14px;
    justify-content: space-between;
    align-items: center;
  }
  .profit-box .label { font-size: 13px; color: #465342; font-weight: 600; }
  .profit-box .value {
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--court-green);
    overflow-wrap: anywhere;
    text-align: right;
    min-width: 0;
  }
  .profit-box.loss .label { color: #a3493e; }
  .profit-box.loss .value { color: #b94f42; }
  .tip { margin-top: auto; padding-top: 9px; font-size: 11px; color: #99958b; text-align: center; line-height: 1.8; }

  /* 窄屏：左右变上下，恢复按内容高度 */
  @media (max-width: 780px) {
    .wrap {
      grid-template-columns: 1fr;
      max-width: 560px;
      align-items: start;
    }
  }
  @media (max-width: 780px) {
    .panel:first-child { border-right: 0; border-bottom: 1px dashed #d5d2c9; border-radius: 18px 18px 0 0; }
    .panel.bill { border-radius: 0; }
  }
  /* 输入框在小屏折成 2 列 */
  @media (max-width: 520px) {
    .row { grid-template-columns: 1fr 1fr; }
    .panel, .panel.bill { padding: 24px 20px; }
  }

  /* 共用行轨道，使两侧标题及两组内容始终对齐。 */
  h1, .bill-title { font-size: 19px; line-height: 1.4; margin: 0 0 6px; }
  .sub, .bill-sub { font-size: 12px; line-height: 20px; margin: 0; }
  .input-header, .bill-header { padding-bottom: 9px; margin: 0; }
  .input-header { border-bottom: 1px solid transparent; }
  .input-section, .bill-section { padding-top: 9px; padding-bottom: 6px; min-width: 0; }
  .section-title, .bill-group-label { font-size: 12px; line-height: 18px; margin: 0 0 5px; }
  .bill-section { border-bottom: 1px solid transparent; }
  .income-section { border-bottom: 0; }
  .line.summary { border-top: 1px solid transparent; padding: 6px 0 0; margin: 5px 0 0; font-size: 12px; line-height: 18px; font-weight: 600; color: #343b32; }
  .line.summary::after { border-bottom: 0; }
  .line.summary span:last-child { font-weight: 700; font-size: 13px; }
  .profit-box { margin-top: 9px; }
  @media (min-width: 781px) {
    .wrap { grid-template-rows: auto auto auto auto; }
    .panel, .panel.bill { display: grid; grid-template-rows: subgrid; grid-row: 1 / span 4; padding: 28px; }
    .panel:first-child { grid-column: 1; }
    .panel.bill { grid-column: 2; }
    .input-header, .bill-header { grid-row: 1; }
    .input-section:nth-of-type(1), .cost-section { grid-row: 2; }
    .input-section:nth-of-type(2), .income-section { grid-row: 3; }
    .bill-footer { grid-row: 4; }
    /* 跳过左侧分组标题的 18px 行高与 5px 间距，首条明细对齐输入标签。 */
    .input-section label { line-height: 18px; }
    .bill-section { padding-top: 32px; }
    .bill-section > .line:first-child { padding-top: 0; font-size: 12px; line-height: 18px; }
  }
  @media (max-width: 780px) {
    .panel.bill { border-radius: 0 0 18px 18px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 左：输入区 ===== -->
  <div class="panel">
    <div class="input-header">
    <h1>羽毛球活动费用计算</h1>
    <div class="sub">输入数字，右侧自动生成账单；自动记住本次填写</div>
    </div>

    <section class="input-section">
    <div class="section-title">场地与用球</div>
    <div class="row">
      <div class="field">
        <label>场地费(元/片/时)</label>
        <input type="number" id="siteRate" value="60" min="0" step="1">
      </div>
      <div class="field">
        <label>场地片数(片)</label>
        <input type="number" id="courts" value="1" min="0" step="1">
      </div>
      <div class="field">
        <label>时长(小时)</label>
        <input type="number" id="hours" value="3" min="0" step="0.5">
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>羽毛球费用(元)</label>
        <input type="number" id="ball" value="300" min="0" step="1">
      </div>
      <div class="field">
        <label>其他费用(元)</label>
        <input type="number" id="other" value="0" min="0" step="1">
      </div>
    </div>

    </section>
    <section class="input-section">
    <div class="section-title">收费与人数</div>
    <div class="row">
      <div class="field">
        <label>男生人数</label>
        <input type="number" id="boys" value="12" min="0" step="1">
      </div>
      <div class="field">
        <label>男生收费</label>
        <input type="number" id="boyPrice" value="50" min="0" step="1">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>女生人数</label>
        <input type="number" id="girls" value="8" min="0" step="1">
      </div>
      <div class="field">
        <label>女生收费</label>
        <input type="number" id="girlPrice" value="40" min="0" step="1">
      </div>
    </div>
    </section>
  </div>

  <!-- ===== 右：账单区 ===== -->
  <div class="panel bill">
    <div class="bill-header">
      <div class="bill-title">活动账单</div>
      <div class="bill-sub">收支明细 · 实时结算</div>
    </div>

    <section class="bill-section cost-section">
    <div class="line"><span>场地费</span><span id="siteTotal">¥0</span></div>
    <div class="line"><span>羽毛球费用</span><span id="ballTotal">¥0</span></div>
    <div class="line"><span>其他费用</span><span id="otherTotal">¥0</span></div>

    <div class="line summary"><span>总成本</span><span id="cost">¥0</span></div>
    </section>
    <section class="bill-section income-section">
    <div class="line sub-line"><span>男生收入</span><span id="boyIncome">¥0</span></div>
    <div class="line sub-line"><span>女生收入</span><span id="girlIncome">¥0</span></div>

    <div class="line summary"><span>总收入</span><span id="income">¥0</span></div>
    </section>

    <div class="bill-footer">
    <div class="profit-box" id="profitBox">
      <span class="label" id="profitLabel">净利润</span>
      <span class="value" id="profit">¥0</span>
    </div>

    <div class="tip" id="tip"></div>
    </div>
  </div>

</div>

<script>
  const ids = ['siteRate', 'courts', 'hours', 'ball', 'other',
               'boys', 'boyPrice', 'girls', 'girlPrice'];
  const $ = id => document.getElementById(id);

  function num(id) {
    const v = parseFloat($(id).value);
    return isNaN(v) ? 0 : v;
  }

  function fmt(n) {
    const sign = n < 0 ? '-' : '';
    const abs = Math.round(Math.abs(n) * 100) / 100;
    return sign + '¥' + abs.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
  }

  function calc() {
    const siteTotal = num('siteRate') * num('courts') * num('hours');
    const ballTotal = num('ball');
    const otherTotal = num('other');

    const boys = num('boys');
    const boyPrice = num('boyPrice');
    const girls = num('girls');
    const girlPrice = num('girlPrice');

    const boyIncome = boys * boyPrice;
    const girlIncome = girls * girlPrice;
    const income = boyIncome + girlIncome;

    const cost = siteTotal + ballTotal + otherTotal;
    const profit = income - cost;
    const totalPeople = boys + girls;

    $('income').textContent = fmt(income);
    $('boyIncome').textContent = fmt(boyIncome);
    $('girlIncome').textContent = fmt(girlIncome);
    $('siteTotal').textContent = fmt(siteTotal);
    $('ballTotal').textContent = fmt(ballTotal);
    $('otherTotal').textContent = fmt(otherTotal);
    $('cost').textContent = fmt(cost);
    $('profit').textContent = fmt(profit);

    const box = $('profitBox');
    const label = $('profitLabel');
    if (profit > 0) {
      box.classList.remove('loss');
      label.textContent = '净利润（赚钱）';
    } else if (profit < 0) {
      box.classList.add('loss');
      label.textContent = '净亏损（亏钱）';
    } else {
      box.classList.remove('loss');
      label.textContent = '净利润（不赚不亏）';
    }

    // 保本提示：按总人数平均收费衡量
    let tip = '';
    if (totalPeople > 0 && cost > 0) {
      const breakEven = cost / totalPeople;
      const avgPrice = income / totalPeople;
      tip = `共 ${totalPeople} 人 · 保本平均每人需收 ${fmt(breakEven)}（当前平均 ${fmt(avgPrice)}）`;
      if (profit < 0) {
        tip += ` · 平均每人再提高 ${fmt(breakEven - avgPrice)} 才回本`;
      }
    } else if (cost > 0 && totalPeople === 0) {
      tip = '人数为 0，没有收入';
    }
    $('tip').textContent = tip;
  }

  const storageKey = 'badminton-cost-calculator:inputs:v1';

  function restoreInputs() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (!saved || typeof saved !== 'object' || Array.isArray(saved)) return;
      ids.forEach(id => {
        const value = saved[id];
        if (typeof value === 'string' &&
            (value === '' || (value.trim() !== '' && Number.isFinite(Number(value))))) {
          $(id).value = value;
        }
      });
    } catch (_) {
      // 存储被禁用或数据损坏时，仍然可以正常计算。
    }
  }

  function saveInputs() {
    try {
      const values = Object.fromEntries(ids.map(id => [id, $(id).value]));
      localStorage.setItem(storageKey, JSON.stringify(values));
    } catch (_) {
      // 存储空间不足或被禁用时，不影响账单计算。
    }
  }

  restoreInputs();
  ids.forEach(id => $(id).addEventListener('input', () => {
    calc();
    saveInputs();
  }));
  calc();
</script>
</body>
</html>
